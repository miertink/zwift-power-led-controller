[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
; Exposes include/ to lib/* sources too (e.g. RBDdimmer including zc_diag.h)
build_flags =
    -Iinclude
lib_deps =
    knolleary/PubSubClient @ ^2.8
    h2zero/NimBLE-Arduino @ ^1.4
; patch_nimble.py re-applies a NimBLE-Arduino connect() fix after every lib install/update
extra_scripts = pre:patch_nimble.py
