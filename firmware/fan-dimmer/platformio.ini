[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Programming/flashing port on this dev machine is always COM4
upload_port = COM4
monitor_port = COM4
; Makes include/ visible to lib/* sources too (e.g. RBDdimmer including zc_diag.h) -
; PlatformIO's LDF doesn't expose the project include/ dir to vendored libs by default.
build_flags =
    -Iinclude
lib_deps =
    knolleary/PubSubClient @ ^2.8
    h2zero/NimBLE-Arduino @ ^1.4
; RBDdimmer is vendored in lib/RBDdimmer (patched: isr_ext() needs a debounce guard
; against zero-cross bounce/noise, and a widened TRIAC gate pulse for reliable latching
; on inductive loads - see zc_diag.h and lib/RBDdimmer/src/esp32/RBDmcuESP32.cpp)
; NimBLE-Arduino is lib_deps-managed (not vendored), so patch_nimble.py re-applies a fix
; to its connect() retry loop after every install/update - see the script for why.
extra_scripts = pre:patch_nimble.py
